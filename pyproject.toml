[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "padding-oracle-python"
version = "0.0.1"
description = "CBC padding-oracle attack project in Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42.0.0",
]

[project.scripts]
padding-oracle = "padding_oracle.cli:main"

[tool.setuptools.packages.find]
include = ["padding_oracle*"]